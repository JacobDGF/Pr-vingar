    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No maximum-scale and no user-scalable=no: locking zoom is a WCAG 1.4.4
         failure, and this is an app people read dates and 500-kr conditions off
         on a phone. viewport-fit=cover keeps the layout under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0088B0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
    <meta
      name="description"
      content="Prövningar hjälper dig hitta och anmäla dig till betygsprövningar i hela Sverige – verifierade skolor, riktiga anmälningslänkar och avstånd till dig."
    />

      property="og:description"
      content="Hitta och anmäl dig till betygsprövningar i hela Sverige – verifierade skolor och riktiga anmälningslänkar."
